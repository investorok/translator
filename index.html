<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Перекладач</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 700px;
      padding: 32px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .lang-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .lang-select {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .lang-select:focus {
      outline: none;
      border-color: #667eea;
    }

    .swap-btn {
      background: #667eea;
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .swap-btn:hover {
      background: #5a6fd6;
      transform: rotate(180deg);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea::placeholder {
      color: #aaa;
    }

    .btn-translate {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }

    .btn-translate:hover {
      opacity: 0.9;
    }

    .btn-translate:active {
      transform: scale(0.98);
    }

    .btn-translate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .output-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .output {
      width: 100%;
      min-height: 140px;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      background: #f9f9f9;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .output.empty {
      color: #aaa;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 12px;
      min-height: 20px;
    }

    .status.error {
      color: #e74c3c;
    }

    .status.loading {
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Перекладач</h1>
    <p class="subtitle">Англійська · Українська · Російська</p>

    <div class="lang-row">
      <select id="fromLang" class="lang-select">
        <option value="en">English</option>
        <option value="uk" selected>Українська</option>
        <option value="ru">Русский</option>
      </select>

      <button class="swap-btn" id="swapBtn" title="Поміняти місцями">⇄</button>

      <select id="toLang" class="lang-select">
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="ru" selected>Русский</option>
      </select>
    </div>

    <textarea id="inputText" placeholder="Введіть текст для перекладу..."></textarea>

    <button class="btn-translate" id="translateBtn">Перекласти</button>

    <div class="output-label">Переклад:</div>
    <div class="output empty" id="output">Тут з'явиться переклад...</div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const fromLang = document.getElementById('fromLang');
    const toLang = document.getElementById('toLang');
    const inputText = document.getElementById('inputText');
    const output = document.getElementById('output');
    const translateBtn = document.getElementById('translateBtn');
    const swapBtn = document.getElementById('swapBtn');
    const status = document.getElementById('status');

    // Swap languages
    swapBtn.addEventListener('click', () => {
      const temp = fromLang.value;
      fromLang.value = toLang.value;
      toLang.value = temp;

      // Also swap text if there's a translation
      if (output.classList.contains('empty') === false && output.textContent) {
        const currentOutput = output.textContent;
        inputText.value = currentOutput;
        output.textContent = 'Тут з\'явиться переклад...';
        output.classList.add('empty');
      }
    });

    async function translate() {
      const text = inputText.value.trim();
      if (!text) {
        status.textContent = 'Введіть текст для перекладу';
        status.className = 'status error';
        return;
      }

      if (fromLang.value === toLang.value) {
        status.textContent = 'Виберіть різні мови';
        status.className = 'status error';
        return;
      }

      translateBtn.disabled = true;
      status.textContent = 'Перекладаю...';
      status.className = 'status loading';
      output.textContent = '';
      output.classList.remove('empty');

      try {
        const langpair = `${fromLang.value}|${toLang.value}`;
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.responseStatus === 200 && data.responseData) {
          output.textContent = data.responseData.translatedText;
          status.textContent = 'Готово';
          status.className = 'status';
        } else {
          throw new Error(data.responseDetails || 'Помилка перекладу');
        }
      } catch (err) {
        output.textContent = 'Не вдалося перекласти. Спробуйте ще раз.';
        output.classList.add('empty');
        status.textContent = 'Помилка: ' + (err.message || 'невідома');
        status.className = 'status error';
      } finally {
        translateBtn.disabled = false;
      }
    }

    translateBtn.addEventListener('click', translate);

    // Enter + Ctrl to translate
    inputText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        translate();
      }
    });
  </script>
</body>
</html>
